name: Charm4py

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "5 0 * * *" # Runs at 00:05 UTC every day.

jobs:
  auto_test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # oldest supported, a middle one, newest
        python-version: ["3.10", "3.13", "3.15"]
        # the macOS runners are arm64 with 3 cores; Linux runners have 4
        os: [ubuntu-26.04, macos-15, macos-26]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Need full repo for 'git describe' used by setup.py
      - name: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install setuptools cython cffi greenlet numpy torch torchvision filelock matplotlib
      - name: Build Charm++/Charm4py
        run: |
          # classic Converse (netlrts and the other machine layers) is on
          # Charm++'s classic branch; the default branch, recharm, builds
          # only Reconverse triplets (the reconverse job below)
          git clone --branch classic https://github.com/charmplusplus/charm charm_src/charm
          export CHARM_EXTRA_BUILD_OPTS="--enable-error-checking"
          export CHARM_BUILD_PROCESSES=$(getconf _NPROCESSORS_ONLN)   # one per core
          export CHARM4PY_BUILD_CFFI=1
          pip install -e .
      - name: Run liveViz unit tests
        run: python -m unittest tests/liveviz/test_liveviz_unit.py
      - name: Run auto_test.py
        run: |
          export PYTHONPATH="$PWD"
          # most tests ask for 4 processes (test_config.json) and need them:
          # on macOS that is 4 PEs on 3 cores, which classic Converse
          # handles (the test step takes about 2 minutes there)
          export CHARM4PY_TEST_NUM_PROCESSES=2
          # needed for param server
          export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
          python auto_test.py

  # Charm4py on Charm++ with Reconverse (Charm++'s recharm line), over LCI.
  reconverse:
    runs-on: ${{ matrix.os }}
    # On the macOS runners every test launch takes about 36 s, with 2 PEs
    # as with 4, so it is not the 3 cores (cause not found yet; about 1 s on
    # Linux and on a Mac laptop): the test step takes about 50 minutes there.
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            triplet: reconverse-linux-x86_64
          - os: macos-26  # Apple Silicon, 3 cores
            triplet: reconverse-darwin-arm8
      fail-fast: false
    env:
      # The Charm++ ref to build: recharm has Reconverse as the
      # contrib/reconverse submodule.
      CHARM_REF: recharm
      # As Charm++'s reconverse CI: LCI takes the first provider libfabric
      # offers, and on some hosted runners that is a hardware provider that
      # fails to start. Hosted runners have no fabric to test anyway.
      FI_PROVIDER: tcp

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Need full repo for 'git describe' used by setup.py
      - name: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y cmake libfabric-dev
          else
            brew install libfabric
          fi
          pip install setuptools cython greenlet numpy torch torchvision filelock matplotlib
      - name: Build Charm++ (Reconverse)/Charm4py
        run: |
          # Reconverse is the contrib/reconverse submodule
          git clone --branch "$CHARM_REF" --recurse-submodules https://github.com/charmplusplus/charm charm_src/charm
          export CHARM4PY_BUILD_TRIPLET=${{ matrix.triplet }}
          export CHARM_EXTRA_BUILD_OPTS="--enable-error-checking"
          export CHARM_BUILD_PROCESSES=$(getconf _NPROCESSORS_ONLN)   # one per core
          pip install .
      - name: Run liveViz unit tests
        # in the source tree: they load charm4py/liveviz.py from it
        run: python -m unittest tests/liveviz/test_liveviz_unit.py
      - name: Run auto_test.py on the installed package
        run: |
          # An installed Charm4py must not need the Charm++ build tree:
          # remove it, and run the tests outside the source tree so that
          # they import the installed package.
          rm -rf charm_src/charm build
          mkdir "$RUNNER_TEMP/c4p_test"
          cp -r auto_test.py test_config.json tests examples "$RUNNER_TEMP/c4p_test/"
          cd "$RUNNER_TEMP/c4p_test"
          export CHARM4PY_TEST_NUM_PROCESSES=2
          # needed for param server
          export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
          python auto_test.py
